[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/cli", "crates/wasm"]
default-members = ["crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
encchat-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
